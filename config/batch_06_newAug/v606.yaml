experiment:
  title_suffix: "v606"
  description: "Is geometric information relevant (compare with v003 )"
general:
  device: 'cuda'
  batch_size : 1024
  weight_decay : 5e-4
  max_epochs : 25
  early_stopping_minDelta: 0.01
  num_workers: 4
data:
  # dataset_root : "D:\\Projekte\\GIA_220412_PCS\\02_Datasets\\FullWaveForm\\full_waveform_software\\FullWaveformParse_mass\\output\\FWF_Subsampled\\0.01" # work pc
  # dataset_root : "/media/hristo/DATA/Projekte/GIA_220412_PCS/02_Datasets/FullWaveForm/full_waveform_software/FullWaveformParse_mass/output/FWF_Aachen_labeled"
  dataset_root : "../../02_Datasets/FWF_Subsampled/0.01_simple/" # home pc
  split: "./config/default_split.yaml"
  preprocessing:
    # Transforms
    # Training transforms
    _transformsTraining_:
      xyz:
        TransCenterXyz: {}
        TransStandardize: {mean:[[0.,0.,0.]], std:[[0.16520438, 0.16500595, 0.13488290]]}
        TransZRotation: {}
        TransScaling: {}
        TransGaussianNoise : {}
      rgb:
        TransStandardize: {mean:[[0.410554, 0.439411, 0.345924]], std:[[0.2817550,0.2817538,0.2855940]]}
        TransGaussianNoise : {}
      riegl_feats:
        TransDropColumn: {column_index: 3}
        TransStandardize: {mean:[[-8.669701, 23.327566, 151.619644, 1.153099]], std:[[4.10935,5.00799,3047.39721,0.42494]]}
        TransGaussianNoise : {}
      geom_feats:
        TransStandardize: {mean:[[0.3780694,0.5266850,0.0952446,0.0012432,0.9047545,0.7732473]], std:[[0.20421646,0.25163340,0.12883001,0.00969308,0.12883275,0.14067655]]}
        TransGaussianNoise : {}
      normals:
        TransStandardize: {mean:[[0.2526888, 0.0181013, 0.0857755]], std:[[0.4752414,0.5395823,0.6414515]]}
        TransGaussianNoise : {}
      incAngles:
        TransStandardize: {mean: 2.1606705, std: 0.370573014}
        TransGaussianNoise : {}
      distanceFromScanner:
        TransStandardize: {mean: 15.88863277, std: 10.879623413}
        TransGaussianNoise : {}
      wfm:
        TransStandardize: {mean: 337.06781006, std: 587.10882568}
        TransGaussianNoise : {}
    
    # Validation transforms (same but no agumentations)
    _transformsValidation_:
      xyz:
        TransCenterXyz: {}
        TransStandardize: {mean:[[0.,0.,0.]], std:[[0.16520438, 0.16500595, 0.13488290]]}
      rgb:
        TransStandardize: {mean:[[0.410554, 0.439411, 0.345924]], std:[[0.2817550,0.2817538,0.2855940]]}
      riegl_feats:
        TransDropColumn: {column_index: 3}
        TransStandardize: {mean:[[-8.669701, 23.327566, 151.619644, 1.153099]], std:[[4.10935,5.00799,3047.39721,0.42494]]}
      geom_feats:
        TransStandardize: {mean:[[0.3780694,0.5266850,0.0952446,0.0012432,0.9047545,0.7732473]], std:[[0.20421646,0.25163340,0.12883001,0.00969308,0.12883275,0.14067655]]}
      normals:
        TransStandardize: {mean:[[0.2526888, 0.0181013, 0.0857755]], std:[[0.4752414,0.5395823,0.6414515]]}
      incAngles:
        TransStandardize: {mean: 2.1606705, std: 0.370573014}
      distanceFromScanner:
        TransStandardize: {mean: 15.88863277, std: 10.879623413}
      wfm:
        TransStandardize: {mean: 337.06781006, std: 587.10882568}
    subsampling: null
  # Dataset
  scalar_input_fields:
    - 'xyz'
    - 'rgb'
    - 'riegl_feats'
    - 'geom_feats'
    - 'normals'
    - 'incAngles'
    - 'distanceFromScanner'
  fw_input_field: True
  label_names:
    # - 'labels_0'
    # - 'labels_1'
    # - 'labels_2'
    - 'labels_3'

  weighted_random_subsample: True
  query_grid_size: 0.15
  subsample_on_gpu: True
  num_neib_normalsComputation: 20
  num_neib_featureExtraction: 128
model:
  use_global_constraint: False
  dropout_prob: 0.3
  ignore_waveform : False
  ignore_neibors : False
testing:
  query_grid_size: 0.03
  batch_size: 1024


